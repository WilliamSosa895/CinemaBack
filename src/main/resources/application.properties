spring.application.name=cinema2
spring.profiles.active=dev
spring.config.import=optional:file:.env.local[.properties]

# Valores restaurados desde .env.local (reemplazados con los valores reales que proporcionaste)
secret.key=${API_KEY:change_me_jwt_secret}
url.frontend=${URL:http://localhost:3000}

# Conexión PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinema}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.devtools.restart.enabled=false

# Email
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from=${SENDGRID_FROM:}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# H2 Console para debugging
spring.h2.console.enabled=true